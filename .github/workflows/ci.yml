# Builds Ardoise and runs every test, including the source and installed-package consumers,
# on Linux, macOS and Windows for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The distribution's Qt, close to the 6.2 minimum.
          - name: Linux, Qt 6.4
            os: ubuntu-24.04
          - name: macOS, Qt 6.8
            os: macos-14
            qt: '6.8.3'
          - name: Windows, Qt 6.8
            os: windows-2022
            qt: '6.8.3'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl-dev

      - name: Install Qt (macOS, Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Install Ninja (macOS, Windows)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        # Every test draws offscreen (QT_QPA_PLATFORM=offscreen, set by CMake).
        run: ctest --test-dir build --output-on-failure
